# Vérifie chaque push sur main et chaque pull request : lint, tests, types et build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# un nouveau push annule la vérification encore en cours sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc -b vérifie les types avant le build Vite
      - run: npm run build

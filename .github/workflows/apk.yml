# Construit l'APK signé quand un tag de version (v1.2.3) est poussé, et l'attache à la release GitHub du tag.
name: APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: APK signé
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Capacitor 8 compile avec le JDK 21
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Version du tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Le tag doit ressembler à v1.2.3, reçu : $GITHUB_REF_NAME"
            exit 1
          fi
          # 1.2.3 donne 10203 : Android n'installe une mise à jour que si ce nombre augmente
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3]))" >> "$GITHUB_ENV"

      - run: npm ci
      # le pied de page de l'appli lit sa version dans package.json
      - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run build:android

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_BASE64 et ANDROID_KEYSTORE_PASSWORD manquants (Settings, Secrets and variables, Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build de l'APK
        working-directory: android
        env:
          KAKUZU_KEYSTORE: ${{ runner.temp }}/release.jks
          KAKUZU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KAKUZU_KEY_ALIAS: kakuzu
          # clé PKCS12 : même mot de passe pour le magasin et la clé
          KAKUZU_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE"

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="kakuzu-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          # relancer le workflow remplace l'APK au lieu d'échouer sur une release déjà créée
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --title "Kakuzu $VERSION" --generate-notes
          fi
